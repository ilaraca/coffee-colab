{% extends "base.html" %}

{% block title %}Redefinir Senha — Coffee Co-lab{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto; text-align: center;">

    <div style="
        width: 64px; height: 64px;
        background: linear-gradient(135deg, #c8952a, #e8b84b);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 1.8rem;
        box-shadow: 0 0 30px rgba(200, 149, 42, 0.3);
    ">🔒</div>

    <h1>Criar nova senha</h1>
    <p style="color: var(--sand); margin-bottom: 2rem; font-size: 0.95rem;">
        Por favor, digite sua nova senha abaixo. Use algo seguro!
    </p>

    {% if error %}
    <div style="
        background: rgba(220, 60, 60, 0.12);
        border: 1px solid rgba(220, 60, 60, 0.35);
        border-radius: 10px;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
        color: #f87171;
        font-size: 0.88rem;
        text-align: left;
    ">{{ error }}</div>
    {% endif %}

    <form method="post" action="/reset-password" class="form-card" style="text-align: left;">
        <input type="hidden" name="token" value="{{ token }}">
        
        <div class="form-group">
            <label for="password">Nova Senha</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Mínimo 8 caracteres" required minlength="8">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Salvar e Entrar</button>
    </form>

</div>
{% endblock %}
