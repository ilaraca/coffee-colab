{% extends "base.html" %}

{% block title %}E-mail verificado! — Coffee Co-lab{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 5rem auto; text-align: center;">

    <div style="
        width: 80px; height: 80px;
        background: linear-gradient(135deg, #27ae60, #2ecc71);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 2.2rem;
        box-shadow: 0 0 30px rgba(46, 204, 113, 0.3);
        animation: pulse-green 2s ease-in-out infinite;
    ">✔</div>

    <style>
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 20px rgba(46, 204, 113, 0.25); }
            50%       { box-shadow: 0 0 40px rgba(46, 204, 113, 0.5); }
        }
    </style>

    <h1 style="font-family: 'Fraunces'; font-size: 2rem; margin-bottom: 0.75rem; color: var(--ink);">
        E-mail confirmado!
    </h1>

    <p style="color: var(--sand); line-height: 1.7; margin-bottom: 2.5rem;">
        Sua conta está ativa. Faça login para começar a explorar o Coffee Co-lab.
    </p>

    <a href="/login" class="btn btn-primary" style="font-size: 1rem; padding: 0.85rem 2.5rem; display: inline-block; border-radius: 8px;">
        Entrar agora →
    </a>
</div>
{% endblock %}
