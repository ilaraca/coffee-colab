{% extends "base.html" %}

{% block title %}Esqueci minha senha — Modo Colab{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto; text-align: center;">

    <div style="
        width: 64px; height: 64px;
        background: linear-gradient(135deg, #c8952a, #e8b84b);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 1.8rem;
    ">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
    </div>

    <h1>Esqueci minha senha</h1>
    <p style="color: var(--sand); margin-bottom: 2rem; font-size: 0.95rem;">
        Digite o e-mail cadastrado na sua conta. Vamos enviar um link para você redefinir sua senha.
    </p>

    {% if error %}
    <div style="
        background: rgba(220, 60, 60, 0.12);
        border: 1px solid rgba(220, 60, 60, 0.35);
        border-radius: 10px;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
        color: #f87171;
        font-size: 0.88rem;
        text-align: left;
    ">{{ error }}</div>
    {% endif %}

    <form method="post" action="/forgot-password" class="form-card" style="text-align: left;">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Redefinir Senha</button>
    </form>

    <div style="margin-top: 1.5rem;">
        <a href="/login" style="color: var(--sand); font-size: 0.85rem; text-decoration: none;">
            ← Voltar ao login
        </a>
    </div>
</div>
{% endblock %}
